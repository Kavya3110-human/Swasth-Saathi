<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swasth Saathi – Voice Health Guide</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f8f5;--card:#fff;--tx:#1b2a23;--mut:#5b6a62;--pri:#1f7a5a;--bd:#dce5df;--g:#dff3e7;--a:#fff0d1;--r:#fddedb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101814;--card:#18231d;--tx:#e8f1ec;--mut:#9db0a5;--pri:#3fb88c;--bd:#2a3a31;--g:#1b3a2a;--a:#403315;--r:#4a1f1c}}
:root[data-theme="dark"]{--bg:#101814;--card:#18231d;--tx:#e8f1ec;--mut:#9db0a5;--pri:#3fb88c;--bd:#2a3a31;--g:#1b3a2a;--a:#403315;--r:#4a1f1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 16px;font-size:15px}
.langs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.langs button{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:16px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.mic{display:flex;flex-direction:column;align-items:center;margin:8px 0 14px}
#mic{width:112px;height:112px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:46px;cursor:pointer;box-shadow:0 6px 20px rgba(31,122,90,.35)}
#mic.on{background:#d33a2c;animation:p 1.1s infinite}
@keyframes p{50%{transform:scale(1.07)}}
#hint{margin-top:10px;color:var(--mut);text-align:center;min-height:26px}
.row{display:flex;gap:8px}
input{flex:1;padding:12px;border:1.5px solid var(--bd);border-radius:10px;font-size:16px;background:var(--card);color:var(--tx);min-width:0}
.go{padding:12px 16px;border-radius:10px;border:0;background:var(--pri);color:#fff;font-size:16px;cursor:pointer}
#out{margin-top:20px}
.card{border-radius:14px;padding:16px;border:1.5px solid var(--bd);background:var(--card)}
.card.green{background:var(--g)}.card.amber{background:var(--a)}.card.red{background:var(--r)}
.badge{font-weight:700;font-size:20px;margin:0 0 6px}
.card h3{margin:14px 0 4px;font-size:16px}
.card ul{margin:0;padding-left:20px}
.say{margin-top:14px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--tx);background:transparent;color:var(--tx);font-size:16px;cursor:pointer}
.dis{margin-top:22px;color:var(--mut);font-size:13px}
</style></head>
<body><main>
<h1>🩺 Swasth Saathi</h1>
<p class="sub" id="sub">Speak your symptoms. Get simple health advice.</p>
<div class="langs" id="langs" role="group" aria-label="Language"></div>
<div class="mic"><button id="mic" aria-label="Tap and speak">🎤</button><div id="hint">Tap the microphone and speak</div></div>
<div class="row"><input id="txt" placeholder="…or type here" aria-label="Type symptoms"><button class="go" id="go">Go</button></div>
<div id="out" aria-live="polite"></div>
<p class="dis">Prototype for guidance only. It is not a doctor and cannot diagnose. In an emergency call your local emergency number (India: 108 or 112).</p>
</main>
<script>
const L=[{c:'en-IN',n:'English',e:'English'},{c:'hi-IN',n:'हिन्दी',e:'Hindi'},{c:'mr-IN',n:'मराठी',e:'Marathi'},{c:'ta-IN',n:'தமிழ்',e:'Tamil'},{c:'te-IN',n:'తెలుగు',e:'Telugu'},{c:'bn-IN',n:'বাংলা',e:'Bengali'}];
const UI={en:['Tap the microphone and speak','Listening…','🔊 Listen again'],hi:['माइक दबाकर बोलिए','सुन रहा हूँ…','🔊 फिर से सुनें'],mr:['माइक दाबून बोला','ऐकत आहे…','🔊 पुन्हा ऐका'],ta:['மைக்கை அழுத்தி பேசுங்கள்','கேட்கிறேன்…','🔊 மீண்டும் கேளுங்கள்'],te:['మైక్ నొక్కి మాట్లాడండి','వింటున్నాను…','🔊 మళ్లీ వినండి'],bn:['মাইক চেপে বলুন','শুনছি…','🔊 আবার শুনুন']};
let cur=L[0],rec=null,last='';
const $=id=>document.getElementById(id),short=()=>cur.c.slice(0,2);
function setLang(l){cur=l;document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===l.c));$('hint').textContent=UI[short()][0]}
L.forEach(l=>{const b=document.createElement('button');b.textContent=l.n;b.dataset.c=l.c;b.onclick=()=>setLang(l);$('langs').appendChild(b)});
setLang(L[0]);

const RED=/chest pain|can'?t breathe|cannot breathe|short(ness)? of breath|unconscious|faint|seizure|fits|heavy bleeding|stroke|paraly|poison|snake|suicid|severe burn|बेहोश|सीने में दर्द|सांस नहीं/i;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function speak(t){if(!('speechSynthesis' in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=cur.c;u.rate=.9;speechSynthesis.speak(u)}

function fallback(t){ // offline rule-based backup (English only)
  if(RED.test(t))return{level:'red',label:'Emergency',summary:'These signs can be serious.',advice:['Call 108 or 112 now','Do not travel alone'],warning_signs:[],speak:'This can be serious. Please call 108 or 112 now.'};
  if(/fever|vomit|diarrh|pain|cough|rash|infection|\d+ days/i.test(t))return{level:'amber',label:'Visit a clinic',summary:'Please get checked at a clinic or health centre soon.',advice:['Drink clean water or ORS','Rest','Visit a doctor within a day or two'],warning_signs:['Trouble breathing','Fever over 3 days','Cannot drink fluids'],speak:'Please visit a clinic soon. Drink clean water and rest.'};
  return{level:'green',label:'Home care',summary:'This looks mild. Rest and drink water.',advice:['Rest','Drink clean water','Eat light food'],warning_signs:['Gets worse','Lasts more than 2 days'],speak:'This looks mild. Rest and drink water. If it gets worse, see a doctor.'};
}

async function triage(t){
  t=t.trim();if(!t)return;
  $('out').innerHTML='<div class="card">…</div>';
  let r;
  try{
    const res=await fetch('/api/triage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,lang:short()})});
    if(!res.ok)throw 0;r=await res.json();
  }catch(e){r=fallback(t)}
  if(!['red','amber','green'].includes(r.level))r.level='amber';
  if(RED.test(t)&&r.level!=='red')r.level='red';
  render(r)
}

function render(r){
  const em={red:'🚨',amber:'🏥',green:'🏡'}[r.level];last=r.speak||r.summary;
  const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  $('out').innerHTML=`<div class="card ${r.level}"><p class="badge">${em} ${esc(r.label)}</p><div>${esc(r.summary)}</div>
  ${r.advice?.length?`<h3>✅</h3><ul>${li(r.advice)}</ul>`:''}
  ${r.warning_signs?.length?`<h3>⚠️</h3><ul>${li(r.warning_signs)}</ul>`:''}
  <button class="say" id="say">${UI[short()][2]}</button></div>`;
  $('say').onclick=()=>speak(last);speak(last)
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=()=>{
  if(!SR){$('hint').textContent='Voice input is not supported in this browser. Please type.';$('txt').focus();return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang=cur.c;rec.interimResults=false;
  rec.onstart=()=>{$('mic').classList.add('on');$('hint').textContent=UI[short()][1]};
  rec.onresult=e=>{const t=e.results[0][0].transcript;$('txt').value=t;triage(t)};
  rec.onerror=()=>{$('hint').textContent='Could not hear. Try again or type.'};
  rec.onend=()=>{rec=null;$('mic').classList.remove('on');if($('hint').textContent===UI[short()][1])$('hint').textContent=UI[short()][0]};
  rec.start()
};
$('go').onclick=()=>triage($('txt').value);
$('txt').onkeydown=e=>{if(e.key==='Enter')triage($('txt').value)};
</script></body></html>
